/* ===== NAVBAR (SAME AS OTHER PAGES) ===== */
.navbar{
  position:fixed;
  top:0; left:0; right:0;
  background:#f8f6f2;

.nav-row a{

  font-size:15px;

  position:relative;
  white-space:nowrap;
}
.nav-row a.active{ border-bottom:2px solid #000; }
.nav-row a:not(:last-child)::after{
  content:"";
  position:absolute;
  right:0; top:50%;
  transform:translateY(-50%);
  height:18px; width:1px;
  background:rgba(0,0,0,.35);
}
.nav-toggle{
  display:none;
  background:none;
  border:none;
  cursor:pointer;
  padding:6px;
  z-index:1100;
}
.nav-toggle svg{width:26px;height:26px;}

.pinned-mobile-links{display:none;}
@media(max-width:768px){
  .pinned-mobile-links{

    align-items:center;

  }
  .pinned-mobile-links a{

    font-size:13px;
    font-weight:600;
    padding:6px 8px;

    padding:6px !important;
  }
  .pinned-cart svg{width:22px;height:22px;}
  .pinned-cart .cart-count{

    align-items:center;
    justify-content:center;
  }
}

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const message = document.getElementById('message').value.trim();

  const text = `Hello Pristine Perfume, my name is ${name} (Contact: ${phone}).%0A%0AQuery: ${message}`;
  const waLink = `https://wa.me/917985494998?text=${text}`;

  window.open(waLink, '_blank');
});
</script>

<script>
(function(){
  function syncPinnedCartBadge(){
    try{
      const cart = JSON.parse(localStorage.getItem('pp_cart') || '[]');
      const totalQty = cart.reduce((s,i)=>s+(i.qty||0),0);
      const el = document.getElementById('cartCountPinned');
      if(el) el.textContent = totalQty;
    }catch(e){}
  }
  syncPinnedCartBadge();
  window.addEventListener('storage', syncPinnedCartBadge);
})();
</script>
