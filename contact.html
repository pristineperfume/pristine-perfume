<meta charset="UTF-8">

<title>Contact Us | Pristine Perfume - Wholesale Attar Supplier in Kannauj</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
}
body{
  font-family:'Playfair Display', serif;
  padding-top:56px;
  background:#fafafa;
  color:#333;
}

/* ===== NAVBAR (SAME AS OTHER PAGES) ===== */
.navbar{
  position:fixed;
  top:0; left:0; right:0;
  background:#f8f6f2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
  z-index:1000;
}
.navbar .logo img{ height:36px; }
.nav-row{ margin:0 auto; display:flex; justify-content:center; }
.nav-row a{
  text-decoration:none;
  color:#333;
  font-size:15px;
  padding:6px 22px;
  position:relative;
  white-space:nowrap;
}
.nav-row a.active{ border-bottom:2px solid #000; }
.nav-row a:not(:last-child)::after{
  content:"";
  position:absolute;
  right:0; top:50%;
  transform:translateY(-50%);
  height:18px; width:1px;
  background:rgba(0,0,0,.35);
}
@media(max-width:768px){
  body{padding-top:72px;}
  .navbar{ flex-direction:column; gap:6px; padding:8px 12px; }
  .navbar .logo img{height:32px;}
  .nav-row{ width:100%; max-width:420px; justify-content:space-between; }
  .nav-row a{ flex:1; text-align:center; font-size:15px; padding:6px 0; }
}

/* ===== CONTENT ===== */
.container{
  max-width:700px;
  margin:auto;
  padding:50px 20px;
}
h1{
  font-family:'Cinzel', serif;
  text-align:center;
  margin-bottom:12px;
}
.sub-text{
  text-align:center;
  color:#555;
  font-size:16px;
  margin-bottom:36px;
}

/* ===== FORM ===== */
.contact-form{
  background:#fff;
  border:1px solid #eee;
  border-radius:10px;
  padding:30px;
  box-shadow:0 4px 18px rgba(0,0,0,0.05);
}
.contact-form label{
  display:block;
  font-size:14px;
  font-weight:600;
  color:#222;
  margin-bottom:6px;
  margin-top:16px;
}
.contact-form input,
.contact-form textarea{
  width:100%;
  padding:12px;
  font-size:15px;
  border:1px solid #ddd;
  border-radius:6px;
  font-family:'Playfair Display', serif;
  box-sizing:border-box;
}
.contact-form textarea{
  min-height:120px;
  resize:vertical;
}
.contact-form button{
  margin-top:24px;
  width:100%;
  background:#25D366;
  color:#fff;
  border:none;
  padding:14px;
  font-size:16px;
  font-weight:600;
  border-radius:30px;
  cursor:pointer;
  transition:opacity .25s ease, transform .25s ease;
}
.contact-form button:active{ transform:scale(.98); opacity:.9; }

.direct-contact{
  text-align:center;
  margin-top:30px;
  font-size:15px;
  color:#555;
}
.direct-contact a{
  color:#0b6cc1;
  text-decoration:none;
  font-weight:600;
}

/* FLOATING WHATSAPP */
.whatsapp-float{
  position:fixed;
  right:16px; bottom:16px;
  width:56px; height:56px;
  background:#25D366;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  z-index:2000;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}
.whatsapp-float img{ width:38px; height:38px; }
.whatsapp-float:active{ transform:scale(.95); }
@media(max-width:768px){
  .whatsapp-float{ right:14px; bottom:14px; width:52px; height:52px; }
}

.footer{ text-align:center; padding:20px; font-size:14px; color:#777; }
</style>

<div class="container">
  <h1>Get in Touch</h1>
  <p class="sub-text">Send us your query below — it will open directly in WhatsApp so we can reply to you instantly.</p>

  <form class="contact-form" id="contactForm">
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="phone">Phone / WhatsApp Number</label>
    <input type="tel" id="phone" placeholder="Enter your number" required>

    <label for="message">Your Query</label>
    <textarea id="message" placeholder="Type your question about attars, wholesale pricing, bulk orders etc." required></textarea>

    <button type="submit">Send Query on WhatsApp</button>
  </form>

  <p class="direct-contact">
    Prefer to chat directly? <a href="https://wa.me/917275266534" target="_blank">Message us on WhatsApp</a>
    or call <a href="tel:+917275266534">+91 72752 66534</a>.
  </p>
</div>

<a href="https://wa.me/917275266534" class="whatsapp-float" target="_blank">
  <img src="whatsapp-icon.png" alt="WhatsApp">
</a>

<footer class="footer">Pristine Perfume — Wholesale Attar Supplier</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const message = document.getElementById('message').value.trim();

  const text = `Hello Pristine Perfume, my name is ${name} (Contact: ${phone}).%0A%0AQuery: ${message}`;
  const waLink = `https://wa.me/917275266534?text=${text}`;

  window.open(waLink, '_blank');
});
</script>
